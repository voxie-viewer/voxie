    # The python version in Ubuntu 16.04 is too old (e.g. for f'' strings which are used in src/Test/Projects/run.py)
    # - "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-dbus python3-pil"
    # - "tools/run-tests --use-release"


build-windows-10:
  stage: build

  tags:
    - windows-10

  script: "powershell -ExecutionPolicy Unrestricted .\\tools\\build-windows.ps1"
  # TODO: Run tests

  artifacts:
    paths:
      - voxie*.zip

  variables:
    VOXIEBUILD_PATH_VISUAL_STUDIO_VC: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Auxiliary\\Build"
    VOXIEBUILD_PATH_QT: "c:\\Qt\\Qt5.6.3\\5.6.3\\msvc2015_64"
    VOXIEBUILD_URL_QT_COPY: "https://www.cis.iti.uni-stuttgart.de/files/src/qt-everywhere-opensource-src-5.6.3.tar.xz"
    VOXIEBUILD_USE_GIT: "1"
    VOXIEBUILD_URL_BASE: "https://www.cis.iti.uni-stuttgart.de/files/src"


build-macos:
  stage: build

  tags:
    - macosx

  script:
    - 'PATH="/opt/Qt5.14.2/5.14.2/clang_64/bin:$PATH" QT_VERSION=5.14.2 tools/create-release-mac.sh --disable-hdf5 --disable-lapack'
    # TODO: Make this work
    # - "tools/run-tests --use-release"
